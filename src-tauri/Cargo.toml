[package]
name = "instalador-harmonika-karaoke"
version = "1.0.0"
description = "Instalador do Harmonika&Co Karaoke (UltraStar Deluxe + tema da empresa)"
authors = ["Harmonika&Co"]
license = "MIT"
edition = "2021"

[lib]
name = "instalador_harmonika_karaoke_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate", "bzip2"] }
dirs = "5"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
